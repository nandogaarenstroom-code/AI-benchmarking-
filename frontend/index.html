<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Local AI Benchmark</title><style>
body{font:16px system-ui;background:#0d1521;color:#eaf2ff;max-width:1000px;margin:40px auto;padding:0 20px}
section{background:#162337;border:1px solid #29405f;border-radius:12px;padding:22px;margin:16px 0}
button,select{padding:11px 16px;border-radius:8px;border:0;margin:6px;background:#35c98f;color:#092015;font-weight:700}
.model{padding:14px;border:1px solid #385577;border-radius:8px;margin:8px 0;cursor:pointer}.selected{border-color:#35c98f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{font-size:24px;color:#35c98f}.muted{color:#9bb0c9}
progress{width:100%;height:20px}table{width:100%;text-align:left;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #29405f}
</style></head><body><h1>LOCAL AI BENCHMARK</h1><p class="muted">LOCAL ONLY · zero-interaction automated evaluation</p>
<section><h2>Detected local models</h2><div id="models">Scanning local AI servers…</div>
<label>Benchmark <select id="profile"><option>STANDARD</option><option>QUICK</option><option>FULL</option><option>PERFORMANCE</option><option>QUALITY</option><option>REASONING</option><option>CODING</option><option>LONG CONTEXT</option></select></label><br>
<label>Export directory <input id="output-dir" type="text" placeholder="Default: results" size="40"></label><br>
<button id="run">🚀 RUN BENCHMARK</button><button id="resume">RESUME PREVIOUS BENCHMARK</button></section>
<section id="progress" hidden><h2>BENCHMARK RUNNING</h2><progress id="bar" value="0" max="1"></progress><p id="live"></p></section>
<section id="result" hidden><h2>BENCHMARK COMPLETE</h2><div class="grid"><div>Quality <div class="metric" id="quality"></div></div><div>Performance <div class="metric" id="performance"></div></div><div>Overall <div class="metric" id="overall"></div></div></div><p id="links"></p><h3>Category scores</h3><table id="categories"></table></section>
<script>
let selected=null;const $=id=>document.getElementById(id);
async function load(){let d=await (await fetch('/api/models')).json();$('models').innerHTML=d.models.map((m,i)=>`<div class="model ${i===0?'selected':''}" data-i="${i}"><b>✓ ${m.name}</b><br><span class="muted">${m.backend} · ${m.size||'Unknown'}</span></div>`).join('');selected=d.models[0];document.querySelectorAll('.model').forEach(e=>e.onclick=()=>{document.querySelectorAll('.model').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');selected=d.models[e.dataset.i]})}
async function poll(){let s=await (await fetch('/api/status')).json();if(s.state==='running'){ $('progress').hidden=false;$('bar').max=s.total||1;$('bar').value=s.progress||0;$('live').textContent=`${s.progress||0} / ${s.total||0} · ${s.current_category||''} · passed ${s.passed||0} · failed ${s.failed||0}`;setTimeout(poll,400)}else if(s.state==='complete'){let r=await (await fetch('/api/results/'+s.result_id)).json();show(r)}}
function show(r){$('progress').hidden=true;$('result').hidden=false;$('quality').textContent=r.scores.quality+'/100';$('performance').textContent=r.scores.performance+'/100';$('overall').textContent=r.scores.overall+'/100';$('links').innerHTML=`<a href="/api/results/${r.id}" download>JSON</a> · <a href="/results/${r.id}.pdf" download>PDF</a> · <a href="/results/${r.id}_answer_sheet.csv" download>Human answer sheet</a>`; $('categories').innerHTML='<tr><th>Category</th><th>Score</th></tr>'+Object.entries(r.quality.categories).filter(x=>x[0]!='overall').map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}
$('run').onclick=async()=>{let output_dir=$('output-dir').value.trim();await fetch('/api/benchmark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:selected,profile:$('profile').value,...(output_dir?{output_dir}:{})})});poll()};$('resume').onclick=async()=>{await fetch('/api/resume',{method:'POST'});poll()};load();poll();
</script></body></html>
